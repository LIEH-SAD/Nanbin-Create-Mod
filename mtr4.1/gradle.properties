# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 3.1.26925
maven_group = com.Nanbin
archives_name = Nanbin
enabled_platforms = fabric,neoforge

# 产物文件名后缀。最终 jar 命名为：
#     Nanbin-<mod_version>+<minecraft_version>+<loader>+<artifact_suffix>.jar
# 格式学自 MTR 4.0 项目（D:\NCM+mtr4.0\Nanbin）的 Nanbin-<版本>+<MC版本>+<loader>+mtr4.jar，
# 本项目基于 MTR 4.1，所以后缀用 mtr4.1。
artifact_suffix = mtr4.1

# Minecraft properties
# 切换到 1.21.4：gradlew build -Pminecraft_version=1.21.4
minecraft_version = 1.21.1

# Dependencies
fabric_loader_version = 0.19.5
yarn_mappings_patch_neoforge_version = 1.21+build.6

# MTR (Minecraft Transit Railway)
mtr_version = 4.1.0-beta.2
