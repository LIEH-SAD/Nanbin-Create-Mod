plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

// 见 Platform#openSignEditor：基于 MTR elementa 组件的界面在 common/src/elementa 里共享。
// NeoForge 端 MTR 把 elementa 重定位到了 org.mtr.libraries.gg.essential.*，
// 所以这里把共享源码做一次包名替换后再编译（同一份源码，两端各自编译）。
def elementaJavaDir = layout.buildDirectory.dir('generated/elementa/java')
def generateElementaSources = tasks.register('generateElementaSources', Copy) {
    from rootProject.file('common/src/elementa/java')
    into elementaJavaDir
    filter { line -> line.replace('gg.essential.', 'org.mtr.libraries.gg.essential.') }
}
sourceSets.main.java.srcDir elementaJavaDir
tasks.named('compileJava') { dependsOn generateElementaSources }
tasks.named('sourcesJar') { dependsOn generateElementaSources }

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Minecraft Transit Railway (MTR 4.1.x)，取自 libs/。
    modImplementation files(rootProject.mtrJarFile('neoforge'))

    // filters：创作标签页筛选
    modImplementation "ziyue.filters:filters-neoforge:$rootProject.filters_version"

    // Nashorn：1.21.x 的 NeoForge 不自带，JS 站牌引擎需要它，直接打进模组
    //一定避免asm冲突
    def nashorn = [
            "org.openjdk.nashorn:nashorn-core:15.4"
    ]
    nashorn.each { dep ->
        compileOnly(dep)
        runtimeOnly(dep)
        include(dep)
    }


    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraftVersion
    inputs.property 'minecraft_range', rootProject.minecraft_range
    inputs.property 'neoforge_range', rootProject.neoforge_range
    inputs.property 'mtr_version', rootProject.mtr_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version,
                minecraft_version: inputs.properties.minecraft_version,
                minecraft_range: inputs.properties.minecraft_range,
                neoforge_range: inputs.properties.neoforge_range,
                mtr_version: inputs.properties.mtr_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
