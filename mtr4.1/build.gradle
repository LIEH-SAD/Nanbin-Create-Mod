plugins {
    // base 提供根项目的 clean / buildDir：没有它，`gradlew clean` 只会清各子项目的 build/，
    // 根目录的 build/（统一产物目录 build/release 就在这里）永远清不掉。
    id 'base'
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

// 一套代码、多版本兼容。
// 目标 Minecraft 版本由 gradle.properties 的 minecraft_version 决定，可用 -Pminecraft_version=<版本> 覆盖：
//     gradlew build                      -> 1.21.1
//     gradlew build -Pminecraft_version=1.21.4
// 新增版本时只需要在下面的表里补一条记录。
def mcVersionPresets = [
        '1.21.1': [
                yarn_mappings     : '1.21.1+build.1',
                // 与 MTR 4.1.0-beta.2 官方锁定的一致（0.116.17 起 resource-loader API 变动会让 MTR 报 AbstractMethodError）
                fabric_api_version: '0.116.12+1.21.1',
                neoforge_version  : '21.1.233',
                neoforge_range    : '21.1',
                minecraft_range   : '[1.21.1,1.21.2)',
                filters_version   : '1.1.0+1.21.1',
                modmenu_version   : '11.0.5',
                // 1.21.x 的 JDK 不再自带 Nashorn，需要打进模组（JS 站牌引擎用，反射调用所以无编译期依赖）
                nashorn_version   : '15.4'
        ],
        '1.21.4': [
                yarn_mappings     : '1.21.4+build.8',
                fabric_api_version: '0.119.4+1.21.4',
                neoforge_version  : '21.4.157',
                neoforge_range    : '21.4',
                minecraft_range   : '[1.21.4,1.21.5)',
                filters_version   : '1.1.0+1.21.4',
                modmenu_version   : '13.0.3',
                nashorn_version   : '15.4'
        ]
]

def targetMcVersion = project.property('minecraft_version').toString()
def mcVersionPreset = mcVersionPresets[targetMcVersion]
if (mcVersionPreset == null) {
    throw new GradleException("不支持的 minecraft_version=${targetMcVersion}，可选值：${mcVersionPresets.keySet().join(', ')}")
}

// 供各子项目使用的“版本相关”属性（通过 rootProject.xxx 访问）。
ext {
    minecraftVersion = targetMcVersion
    yarn_mappings = mcVersionPreset.yarn_mappings
    fabric_api_version = mcVersionPreset.fabric_api_version
    neoforge_version = mcVersionPreset.neoforge_version
    neoforge_range = mcVersionPreset.neoforge_range
    minecraft_range = mcVersionPreset.minecraft_range
    filters_version = mcVersionPreset.filters_version
    modmenu_version = mcVersionPreset.modmenu_version
    nashorn_version = mcVersionPreset.nashorn_version

    // 从 libs 中取当前 loader + 当前 Minecraft 版本对应的 MTR jar。
    // 注意区分 MTR 4.1（本项目）与 MTR 4.0。
    mtrJarFile = { String loader ->
        def jar = new File(rootDir, "libs/MTR-${loader}-${mtr_version}+${targetMcVersion}.jar")
        if (!jar.exists()) {
            throw new GradleException("找不到 MTR 依赖：${jar}\n" +
                    "请确认 libs 目录中存在 MTR-${loader}-${mtr_version}+${targetMcVersion}.jar " +
                    "(当前 minecraft_version=${targetMcVersion}, loader=${loader})")
        }
        return jar
    }
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric-1.21.1`.
        // 带上 Minecraft 版本，避免 1.21.1 / 1.21.4 两个版本的产物互相覆盖。
        archivesName = "$rootProject.archives_name-$project.name-$rootProject.minecraftVersion"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        mavenCentral()
        // filters（创作标签页筛选，上游 zi yue 提供 fabric/neoforge 双端）
        maven { url = 'https://maven.ziyuesinicization.site/releases/' }
        // ModMenu（仅 Fabric，配置界面入口）
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraftVersion"
        mappings loom.layered {
            it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings:v2")
            it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$rootProject.yarn_mappings_patch_neoforge_version")
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        // Minecraft 1.21.x 官方支持 Java 21；用工具链保证编译与 runClient 都用 21，
        // 避免用更高版本 JDK 运行游戏时出现兼容问题。
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        // 源码含中文注释，固定用 UTF-8 编译，避免受系统默认编码影响
        it.options.encoding = 'UTF-8'
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }

    // 统一命名 + 统一产物目录（做法学自 MTR 4.0 项目 D:\NCM+mtr4.0\Nanbin）：
    //   * 命名：那边是 Nanbin-<version>+<minecraftVersion>+<loader>+mtr4.jar，
    //     这里沿用同一格式，后缀对应本项目的 MTR 4.1，即
    //     Nanbin-<version>+<minecraftVersion>+<loader>+mtr4.1.jar。
    //   * 位置：那边由 buildSrc 的 BuildTools#copyBuildFile 在每个子项目 build 结束时
    //     把 jar 拷到 <root>/build/release，这里用 copyToRelease 任务做同样的事。
    // 只处理各平台（fabric / neoforge）；common 的 jar 是中间产物，不参与发布。
    // 文件名里带 Minecraft 版本，所以 1.21.1 / 1.21.4 的产物可以同时躺在
    // build/release 里，不会互相覆盖。
    if (rootProject.enabled_platforms.split(',').collect { it.trim() }.contains(project.name)) {
        // 最终 jar（remapJar 的产物）按 MTR 4.0 项目的格式命名。
        tasks.named('remapJar') {
            archiveFileName = "${rootProject.archives_name}-${project.version}+${rootProject.minecraftVersion}+${project.name}+${rootProject.artifact_suffix}.jar"
        }

        def copyToRelease = tasks.register('copyToRelease', Copy) {
            group = 'build'
            description = "把 ${project.name} 端的最终 jar 复制到根目录 build/release"
            from tasks.named('remapJar').flatMap { it.archiveFile }
            into rootProject.layout.buildDirectory.dir('release')
        }

        // 挂到 build 上：执行 `gradlew build`（或 `gradlew build -Pminecraft_version=1.21.4`）后，
        // 最终产物就已经在 build/release/ 里了。
        tasks.named('build') {
            dependsOn copyToRelease
        }
    }
}

// 便利任务：依次为表里所有 Minecraft 版本各跑一次 build。
// 版本是靠 Gradle 属性切换的，所以这里只能起独立的 Gradle 进程。
def buildAllVersions = tasks.register('buildAllVersions') {
    group = 'build'
    description = '为 mcVersionPresets 中的每个 Minecraft 版本依次执行 build'
}

mcVersionPresets.keySet().each { version ->
    def task = tasks.register("buildFor_${version.replace('.', '_')}", Exec) {
        group = 'build'
        description = "以 minecraft_version=${version} 执行 gradlew build"
        workingDir = rootDir
        def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
        def gradlew = new File(rootDir, isWindows ? 'gradlew.bat' : 'gradlew').absolutePath
        // Windows 下 .bat 必须经 cmd.exe 启动
        commandLine(isWindows
                ? ['cmd', '/c', gradlew, 'build', "-Pminecraft_version=${version}"]
                : [gradlew, 'build', "-Pminecraft_version=${version}"])
    }
    buildAllVersions.configure { dependsOn task }
}
