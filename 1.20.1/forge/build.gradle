plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "nanbin.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // YMTR（mod id: mtr）的 Forge 包里 mtr/screen/WidgetShorterSlider.class 同样含有一份
    // 重映射后会与 m_87963_（srg 名，即 renderButton）同名的死方法 renderButton，
    // 导致 Loom 在 srg -> official 重映射阶段报 "Mapping target name conflicts detected"。
    // 因此这里也使用 libs/ 下删掉重复方法的官方包。
    // 重新生成方式见 tools/MtrJarPatcher.java（升级 YMTR 版本后需要重跑）。
    modImplementation files(rootProject.file("libs/MTR-forge-1.20.1-3.6.3-patched.jar"))
    implementation("ziyue.filters:filters-forge:1.0.0+1.20.1") {exclude(group: "net.minecraftforge")}
    // Nashorn JS 引擎（JS 告示牌脚本执行）；编译期依赖即可。
    compileOnly("org.openjdk.nashorn:nashorn-core:15.4")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// 正式发布文件：将 remapJar 成品复制到根项目 build/release，
// 并按 <ModName>-<mod_version>+<minecraft_version>+<platform>+mtr3 命名。
def releaseFileName = "${rootProject.archives_name.capitalize()}-${rootProject.mod_version}+${rootProject.minecraft_version}+${project.name}+mtr3.jar"
def releaseDir = new File(rootProject.projectDir, 'build/release')

tasks.register('releaseJar', Copy) {
    group = 'build'
    description = 'Copy the remapped release jar into the root project build/release with the release naming scheme.'
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into releaseDir
    rename { fileName -> releaseFileName }
}

tasks.named('build') {
    dependsOn tasks.named('releaseJar')
}
