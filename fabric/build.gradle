import org.mtr.mod.BuildTools

plugins {
    id "java"
    id "com.github.johnrengelman.shadow" version "+"
    id "fabric-loom" version "1.10-SNAPSHOT"
}

apply from: rootProject.file("gradle/node.gradle")

// The Minecraft version of the current Stonecutter node (for example :fabric:1.20.1).
def minecraftVersion = stonecutter.current.version
def branchDir = rootProject.file("fabric")

final BuildTools buildTools = new BuildTools(minecraftVersion, "fabric", mtrVersion, project, branchDir)

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${buildTools.getYarnVersion()}:v2"
    modImplementation "net.fabricmc:fabric-loader:${buildTools.getFabricVersion()}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${buildTools.getFabricApiVersion()}"
    modApi "com.terraformersmc:modmenu:${buildTools.getModMenuVersion()}"
    modApi("ziyue.filters:filters-fabric:${buildTools.getFiltersVersion()}") {
        exclude(group: "net.fabricmc")
    }
    modImplementation "org.mtr:MTR-fabric:${mtrVersion}+${minecraftVersion}"

    // Nashorn 引擎（org.openjdk.nashorn:nashorn-core）：fabric 环境不自带，需 include 打包进 mod。
    // 依赖的 asm 由 Minecraft/fabric-loader 运行时提供（生产版本 json 自带 org.ow2.asm:9.9），无需打包。
    def nashorn = [
            "org.openjdk.nashorn:nashorn-core:15.4"
    ]
    nashorn.each { dep ->
        compileOnly(dep)
        // runtimeOnly 使 dev 环境（runClient / IntelliJ）运行时也能找到 Nashorn 类；
        // include 负责把依赖打进 mod jar 的 META-INF/jars/（JarInJar）。
        runtimeOnly(dep)
        include(dep)
    }
}

// 从 remapJar 的分析 classpath 中排除 include 的引擎 jar（mod 代码仅通过 javax.script + 反射间接使用，无需重映射）
configurations {
    includedJars {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom configurations.include
    }
}

afterEvaluate {
    def includedJarFiles = configurations.includedJars.resolvedConfiguration.resolvedArtifacts.collect { it.file }
    tasks.named("remapJar").configure {
        classpath.setFrom(classpath.files.findAll { f -> !includedJarFiles.contains(f) })
    }
}

repositories {
    maven { url = "https://maven.terraformersmc.com/" }
}

shadowJar {
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(buildTools.javaLanguageVersion))
    }
    withSourcesJar()
}

// 每个版本节点单独生成 fabric.mod.json，避免多版本并行构建时互相覆盖。
def generatedResources = layout.buildDirectory.dir("generated/templates")

tasks.register("setupFiles") {
    group = "nanbin"
    description = "Generate fabric.mod.json for Minecraft ${minecraftVersion}"

    def template = new File(branchDir, "src/main/fabric.mod.template.json")
    inputs.file(template)
    inputs.property("version", version)
    inputs.property("minecraftVersion", minecraftVersion)
    outputs.dir(generatedResources)

    doLast {
        // 旧版构建会把 fabric.mod.json 写进共享源码目录；现在改为每个版本单独生成。
        new File(branchDir, "src/main/resources/fabric.mod.json").delete()

        def target = generatedResources.get().file("fabric.mod.json").asFile
        target.parentFile.mkdirs()
        target.text = template.text
                .replace("@version@", version.toString())
                .replace("@minecraftVersion@", minecraftVersion)
    }
}

sourceSets.main.resources.srcDir(generatedResources)

tasks.named("sourcesJar") {
    dependsOn("setupFiles")
}

// 离线绘制测试：不开游戏把吊板线路图渲染成 PNG（build/draw-test），用于调比例/排版
tasks.register("drawTest", JavaExec) {
    group = "verification"
    description = "把吊板线路图离线渲染成 PNG（fabric/build/draw-test）"
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.Nanbin.dev.LineMapDrawTest"
    args = ["build/draw-test", "768"]
}

compileJava.dependsOn("setupFiles")
processResources.dependsOn("setupFiles")

build {
    doLast {
        buildTools.copyBuildFile()
    }
}

remapJar {
    dependsOn(shadowJar)
    mustRunAfter(shadowJar)
    inputFile = file(shadowJar.archivePath)
    archiveFileName.set("Nanbin-${version}+${minecraftVersion}+fabric+mtr4.jar")
}