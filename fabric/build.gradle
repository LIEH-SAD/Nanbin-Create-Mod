plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // 见 :common 中的说明：Fabric 包必须用 libs/ 里修掉重复 renderButton 的版本，
    // 否则 Loom 重映射阶段会因 "unfixable conflicts" 失败。
    modImplementation files(rootProject.file("libs/MTR-fabric-1.20.1-3.6.3-patched.jar"))
    modApi("ziyue.filters:filters-fabric:1.0.0+1.20.1") {exclude(group: "net.fabricmc")}
    modImplementation "com.terraformersmc:modmenu:7.2.2"

    // 防止asm冲突
    def nashorn = [
            "org.openjdk.nashorn:nashorn-core:15.4"
    ]
    nashorn.each { dep ->
        compileOnly(dep)
        runtimeOnly(dep)
        include(dep)
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// 正式发布文件：将 remapJar 成品复制到根项目 build/release，
// 并按 <ModName>-<mod_version>+<minecraft_version>+<platform>+mtr3 命名。
def releaseFileName = "${rootProject.archives_name.capitalize()}-${rootProject.mod_version}+${rootProject.minecraft_version}+${project.name}+mtr3.jar"
def releaseDir = new File(rootProject.projectDir, 'build/release')

tasks.register('releaseJar', Copy) {
    group = 'build'
    description = 'Copy the remapped release jar into the root project build/release with the release naming scheme.'
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into releaseDir
    rename { fileName -> releaseFileName }
}

tasks.named('build') {
    dependsOn tasks.named('releaseJar')
}