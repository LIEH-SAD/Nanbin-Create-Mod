plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// 见 Platform#openSignEditor：基于 MTR elementa 组件的界面在 common/src/elementa 里共享。
// Fabric 端 elementa 的包名就是 gg.essential.*，直接拿来编译即可；
// elementa 本体在 Fabric 上是 MTR jar 里的嵌套 jar（见 common/build.gradle 的解包任务）。
sourceSets.main.java.srcDir rootProject.file('common/src/elementa/java')

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Minecraft Transit Railway (MTR 4.1.x)，取自 libs/。
    modImplementation files(rootProject.mtrJarFile('fabric'))

    // filters：创作标签页筛选
    modImplementation "ziyue.filters:filters-fabric:$rootProject.filters_version"

    // ModMenu：只用来挂配置界面入口；编译期可见即可，未安装时 Fabric 会跳过该 entrypoint
    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    // Nashorn：1.21.x 的 JDK 不再自带，Fabric 侧也没有现成的（NeoForge 侧自带，见 neoforge/build.gradle），
    // JS 站牌引擎需要它，所以这里直接打进模组
    //一定避免asm冲突（ASM 由 fabric-loader/启动器提供，不能一起打包）
    def nashorn = [
            "org.openjdk.nashorn:nashorn-core:$rootProject.nashorn_version"
    ]
    nashorn.each { dep ->
        compileOnly(dep)
        runtimeOnly(dep)
        include(dep)
    }

    // elementa（MTR 的界面库）：Fabric 端它是 MTR jar 里的嵌套 jar，
    // 由 common/build.gradle 在配置期解到根目录的 .mtr-nested-jars，这里只用于编译界面源码
    // （见 Platform#openSignEditor）
    modCompileOnly fileTree(rootProject.file('.mtr-nested-jars')) { include '*.jar' }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraftVersion
    inputs.property 'mtr_version', rootProject.mtr_version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version,
                minecraft_version: inputs.properties.minecraft_version,
                mtr_version: inputs.properties.mtr_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
