import org.mtr.mod.BuildTools

plugins {
	id "java"
	id "com.github.johnrengelman.shadow" version "+"
	id "net.minecraftforge.gradle" version "6.+"
	id "org.spongepowered.mixin" version "+"
}

apply from: rootProject.file("gradle/node.gradle")

repositories {
    mavenCentral()
}

// The Minecraft version of the current Stonecutter node (for example :forge:1.20.1).
def minecraftVersion = stonecutter.current.version
def branchDir = rootProject.file("forge")
def branchResources = new File(branchDir, "src/main/resources")

final BuildTools buildTools = new BuildTools(minecraftVersion, "forge", mtrVersion, project, branchDir)

minecraft {
	mappings channel: "official", version: minecraftVersion
	accessTransformer = new File(branchResources, "META-INF/accesstransformer.cfg")
	runs {
		configureEach {
			property "forge.logging.markers", "REGISTRIES"
			property "forge.logging.console.level", "debug"
			mods {
				nanbin {
					source sourceSets.main
				}
			}
		}
		client {}
		server { args "--nogui" }
	}
}

sourceSets.main.resources { srcDir new File(branchDir, "src/generated/resources") }

tasks.processResources {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	from(branchResources) {
		into ""
	}
}

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${buildTools.getForgeVersion()}"
    annotationProcessor "org.spongepowered:mixin:+:processor"
    implementation fg.deobf("org.mtr:MTR-forge:${mtrVersion}+${minecraftVersion}")

    implementation(fg.deobf("ziyue.filters:filters-forge:${buildTools.getFiltersVersion()}"))

    // Nashorn 引擎：forge 1.20.1 环境自带 org.openjdk.nashorn:nashorn-core:15.4（含 asm），
    // 因此这里不打包任何 JS 引擎，避免与环境中/其他 mod 的 nashorn/graal 模块冲突。
}

mixin {
	config "nanbin.mixins.json"
	debug.verbose = true
	debug.export = true
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(buildTools.javaLanguageVersion))
	}
	withSourcesJar()
}

// 每个版本节点单独生成 mods.toml，避免多版本并行构建时互相覆盖。
def generatedResources = layout.buildDirectory.dir("generated/templates")

tasks.register("setupFiles") {
	group = "nanbin"
	description = "Generate META-INF/mods.toml for Minecraft ${minecraftVersion}"

	def template = new File(branchDir, "src/main/mods.template.toml")
	inputs.file(template)
	inputs.property("version", version)
	inputs.property("minecraftVersion", minecraftVersion)
	inputs.property("mtrVersion", mtrVersion)
	outputs.dir(generatedResources)

	doLast {
		// 旧版构建会把 mods.toml 写进共享源码目录；现在改为每个版本单独生成。
		new File(branchDir, "src/main/resources/META-INF/mods.toml").delete()

		def target = generatedResources.get().file("META-INF/mods.toml").asFile
		target.parentFile.mkdirs()
		target.text = template.text
				.replace("@version@", version.toString())
				.replace("@minecraftVersion@", minecraftVersion)
				.replace("@mtrVersion@", mtrVersion.toString())
	}
}

sourceSets.main.resources.srcDir(generatedResources)

tasks.named("sourcesJar") {
	dependsOn(rootProject.tasks.named("syncForgeSources"), "setupFiles")
}

// Stonecutter preprocesses forge/src, which syncForgeSources writes to.
tasks.configureEach {
	if (name.startsWith("stonecutter")) {
		dependsOn(rootProject.tasks.named("syncForgeSources"))
	}
}

compileJava.dependsOn(rootProject.tasks.named("syncForgeSources"), "setupFiles")
processResources.dependsOn(rootProject.tasks.named("syncForgeSources"), "setupFiles")

build {
	doLast {
		buildTools.copyBuildFile()
	}
}

shadowJar {
	archiveFileName.set("Nanbin-${version}+${minecraftVersion}+forge+mtr4.jar")
	finalizedBy "reobfShadowJar"
	configurations = [project.configurations.shadow]
	zip64 true
}

reobf {
	shadowJar {}
}

assemble.dependsOn shadowJar