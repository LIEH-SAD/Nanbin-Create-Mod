// Shared configuration for every Stonecutter node project (:fabric:<version>, :forge:<version>).
group = "com.Nanbin"
version = rootProject.version

configurations {
	shadowImplementation
	implementation.extendsFrom shadowImplementation
}

dependencies {
	compileOnly "com.google.code.findbugs:jsr305:+"
}

shadowJar {
	configurations = [project.configurations.shadowImplementation]
}

repositories {
	mavenCentral()
	// Relative flatDir paths resolve against the node directory, so use the root project explicitly.
	flatDir { dirs rootProject.file("libs") }
	maven { url "https://jitpack.io" }
	maven { url "https://maven.ziyuesinicization.site/releases/" }
	maven { url "https://maven.shedaniel.me/" }
}